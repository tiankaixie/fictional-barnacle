name: Cebu
options:
  bundleIdPrefix: com.tiankaixie
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  xcodeVersion: "15.0"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.7.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false

targets:
  Cebu:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Cebu
        excludes:
          - "**/README.md"
    dependencies:
      - package: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiankaixie.cebu
        INFOPLIST_FILE: Cebu/Info.plist
        # CODE_SIGN_ENTITLEMENTS: Cebu.entitlements  # Disabled - requires paid Apple Developer account
        ENABLE_PREVIEWS: true
        DEVELOPMENT_ASSET_PATHS: "\"Cebu/Preview Content\""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
    info:
      path: Cebu/Info.plist
      properties:
        CFBundleDisplayName: Cebu
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Cebu needs access to your microphone to record voice notes."
        NSSpeechRecognitionUsageDescription: "Cebu uses on-device speech recognition to transcribe your voice notes."
        NSFaceIDUsageDescription: "Cebu 使用 Face ID 保护您的日记隐私"
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
